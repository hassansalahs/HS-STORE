<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم HS STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14151A; --surface: #1D1F26; --line: #2C2E36;
    --text: #EDEDEA; --muted: #8B8D97; --accent: #FF7A30;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--bg); color:var(--text); font-family:'Cairo', sans-serif; line-height:1.6; min-height:100vh; }
  .num{ font-family:'Space Grotesk', sans-serif; }
  .wrap{ max-width:900px; margin:0 auto; padding:40px 24px; }

  /* Login screen */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .login-box{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:36px; width:100%; max-width:360px;
  }
  .login-box h1{ font-size:1.3rem; margin-bottom:24px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.82rem; color:var(--muted); margin-bottom:6px; }
  .field input{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px;
    padding:10px 12px; color:var(--text); font-family:'Cairo', sans-serif; font-size:0.9rem;
  }
  .field input:focus{ outline:none; border-color:var(--accent); }
  .btn{
    background:var(--accent); color:#191008; font-weight:700; border:none;
    border-radius:4px; padding:11px 20px; font-family:'Cairo', sans-serif;
    font-size:0.9rem; cursor:pointer; width:100%;
  }
  .btn-outline{
    background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; padding:11px 20px; font-family:'Cairo', sans-serif;
    font-size:0.9rem; cursor:pointer;
  }
  .error-msg{ color:#FF6B6B; font-size:0.85rem; margin-top:10px; display:none; }

  /* Admin dashboard */
  #dashboard{ display:none; }
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:32px;
  }
  .topbar h1{ font-size:1.2rem; }
  .topbar .actions{ display:flex; gap:10px; align-items:center; }
  a.view-site{ color:var(--muted); font-size:0.85rem; }

  .panel-block{
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:26px; margin-bottom:28px;
  }
  .panel-block h2{ font-size:1.05rem; margin-bottom:18px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid .full{ grid-column:1/-1; }

  table{ width:100%; border-collapse:collapse; margin-top:6px; }
  th{ text-align:right; color:var(--muted); font-size:0.8rem; font-weight:600; padding:8px 6px; border-bottom:1px solid var(--line); }
  td{ padding:10px 6px; border-bottom:1px solid var(--line); font-size:0.9rem; vertical-align:middle; }
  td.actions-cell{ display:flex; gap:8px; }
  .icon-btn{
    background:transparent; border:1px solid var(--line); border-radius:4px;
    color:var(--muted); font-size:0.8rem; padding:6px 10px; cursor:pointer;
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .icon-btn.danger:hover{ border-color:#FF6B6B; color:#FF6B6B; }

  .save-msg{ color:#7CD98B; font-size:0.85rem; margin-top:10px; display:none; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>تسجيل دخول لوحة التحكم</h1>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="login-email" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    <button class="btn" id="login-btn">دخول</button>
    <p class="error-msg" id="login-error">البريد أو كلمة المرور غلط.</p>
  </div>
</div>

<div id="dashboard">
  <div class="wrap">
    <div class="topbar">
      <h1>لوحة تحكم <span class="num">HS STORE</span></h1>
      <div class="actions">
        <a class="view-site" href="index.html" target="_blank">عرض الموقع ↗</a>
        <button class="btn-outline" id="logout-btn">تسجيل خروج</button>
      </div>
    </div>

    <div class="panel-block">
      <h2>إعدادات الواجهة</h2>
      <div class="form-grid">
        <div class="full">
          <label style="font-size:0.8rem; color:var(--muted);">اسم المتجر</label>
          <input type="text" id="s-name" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--text); margin-top:6px;">
        </div>
        <div class="full">
          <label style="font-size:0.8rem; color:var(--muted);">عنوان الواجهة الرئيسي</label>
          <input type="text" id="s-hero-title" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--text); margin-top:6px;">
        </div>
        <div class="full">
          <label style="font-size:0.8rem; color:var(--muted);">الوصف تحت العنوان</label>
          <input type="text" id="s-hero-sub" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--text); margin-top:6px;">
        </div>
        <div>
          <label style="font-size:0.8rem; color:var(--muted);">رقم واتساب (بدون + وبرمز الدولة)</label>
          <input type="text" id="s-whatsapp" placeholder="9647xxxxxxxxx" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--text); margin-top:6px;">
        </div>
        <div>
          <label style="font-size:0.8rem; color:var(--muted);">الموقع (يظهر بالفوتر)</label>
          <input type="text" id="s-location" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--text); margin-top:6px;">
        </div>
      </div>
      <button class="btn" id="save-settings-btn" style="width:auto; padding:10px 24px; margin-top:18px;">حفظ الإعدادات</button>
      <p class="save-msg" id="settings-saved">تم الحفظ ✓</p>
    </div>

    <div class="panel-block">
      <h2>إضافة منتج جديد</h2>
      <div class="form-grid">
        <div class="full">
          <label style="font-size:0.8rem; color:var(--muted);">اسم المنتج</label>
          <input type="text" id="p-name" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--text); margin-top:6px;">
        </div>
        <div>
          <label style="font-size:0.8rem; color:var(--muted);">المواصفات</label>
          <input type="text" id="p-spec" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--text); margin-top:6px;">
        </div>
        <div>
          <label style="font-size:0.8rem; color:var(--muted);">السعر</label>
          <input type="text" id="p-price" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--text); margin-top:6px;">
        </div>
        <div class="full">
          <label style="font-size:0.8rem; color:var(--muted);">رابط صورة (اختياري)</label>
          <input type="url" id="p-image" placeholder="https://..." style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; color:var(--text); margin-top:6px;">
        </div>
      </div>
      <button class="btn" id="add-product-btn" style="width:auto; padding:10px 24px; margin-top:18px;">إضافة المنتج</button>
    </div>

    <div class="panel-block">
      <h2>المنتجات الحالية</h2>
      <table>
        <thead>
          <tr><th>الاسم</th><th>السعر</th><th>المواصفات</th><th></th></tr>
        </thead>
        <tbody id="products-table-body">
          <tr><td colspan="4" style="color:var(--muted);">جارِ التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  // ====== نفس القيم اللي حطيتها بملف index.html ======
  const firebaseConfig = {
    apiKey: "AIzaSyCB17mPjwJVTcRb8C3P4veVymTt8EwXO84",
    authDomain: "hs-store-40a0d.firebaseapp.com",
    projectId: "hs-store-40a0d",
    storageBucket: "hs-store-40a0d.firebasestorage.app",
    messagingSenderId: "1041262430506",
    appId: "1:1041262430506:web:d575998c3a7d9c7e0bf653"
  };
  // =====================================================

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const loginScreen = document.getElementById('login-screen');
  const dashboard = document.getElementById('dashboard');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const loginError = document.getElementById('login-error');

  loginBtn.addEventListener('click', () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    loginError.style.display = 'none';
    auth.signInWithEmailAndPassword(email, pass).catch(() => {
      loginError.style.display = 'block';
    });
  });

  logoutBtn.addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged(user => {
    if(user){
      loginScreen.style.display = 'none';
      dashboard.style.display = 'block';
      loadSettings();
      loadProducts();
    } else {
      loginScreen.style.display = 'flex';
      dashboard.style.display = 'none';
    }
  });

  // ---- Settings ----
  function loadSettings(){
    db.collection('settings').doc('site').get().then(doc => {
      if(!doc.exists) return;
      const s = doc.data();
      document.getElementById('s-name').value = s.storeName || '';
      document.getElementById('s-hero-title').value = s.heroTitle || '';
      document.getElementById('s-hero-sub').value = s.heroSub || '';
      document.getElementById('s-whatsapp').value = s.whatsapp || '';
      document.getElementById('s-location').value = s.location || '';
    });
  }

  document.getElementById('save-settings-btn').addEventListener('click', () => {
    const data = {
      storeName: document.getElementById('s-name').value.trim(),
      heroTitle: document.getElementById('s-hero-title').value.trim(),
      heroSub: document.getElementById('s-hero-sub').value.trim(),
      whatsapp: document.getElementById('s-whatsapp').value.trim(),
      location: document.getElementById('s-location').value.trim()
    };
    db.collection('settings').doc('site').set(data, { merge: true }).then(() => {
      const msg = document.getElementById('settings-saved');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 2000);
    });
  });

  // ---- Products ----
  const tableBody = document.getElementById('products-table-body');

  function loadProducts(){
    db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snap => {
      if(snap.empty){
        tableBody.innerHTML = '<tr><td colspan="4" style="color:var(--muted);">ما في منتجات بعد.</td></tr>';
        return;
      }
      tableBody.innerHTML = '';
      snap.forEach(doc => {
        const p = doc.data();
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.name || ''}</td>
          <td class="num">${p.price || ''} د.ع</td>
          <td style="color:var(--muted);">${p.spec || ''}</td>
          <td class="actions-cell">
            <button class="icon-btn danger" data-id="${doc.id}">حذف</button>
          </td>
        `;
        tr.querySelector('.danger').addEventListener('click', () => {
          if(confirm('متأكد من حذف هذا المنتج؟')){
            db.collection('products').doc(doc.id).delete();
          }
        });
        tableBody.appendChild(tr);
      });
    });
  }

  document.getElementById('add-product-btn').addEventListener('click', () => {
    const name = document.getElementById('p-name').value.trim();
    const spec = document.getElementById('p-spec').value.trim();
    const price = document.getElementById('p-price').value.trim();
    const image = document.getElementById('p-image').value.trim();
    if(!name || !price){ alert('اسم المنتج والسعر مطلوبين'); return; }
    db.collection('products').add({
      name, spec, price, image,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      document.getElementById('p-name').value = '';
      document.getElementById('p-spec').value = '';
      document.getElementById('p-price').value = '';
      document.getElementById('p-image').value = '';
    });
  });
</script>
</body>
</html>
